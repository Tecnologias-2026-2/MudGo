<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Servicio confirmado – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="cliente" data-nav="seguimiento" data-page="c-confirmado">
  <div class="app">
    <main class="main" data-back="dashboard-cliente.html" data-title="Servicio confirmado">
      <div class="container container--narrow">

        <div id="confirm-root">
          <div id="cs-flow"></div>
          <div class="text-center" style="margin:28px 0 24px">
            <div class="status-icon status-icon--green status-icon--lg"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div>
            <h1 class="mt-16" style="font-size:22px">¡Mudanza confirmada!</h1>
            <p class="page-head__sub">Tu pago fue procesado exitosamente. Tu proveedor ha sido notificado.</p>
          </div>
          <section class="card card--blue row row--between">
            <div><div class="small blue">Número de servicio</div><div class="blue" style="font-size:18px" id="cs-number">#MG-20260810-0042</div></div>
            <span class="badge badge--blue badge--dot" style="background:#fff">Confirmado</span>
          </section>
          <section class="card"><p class="label-caps">Detalles de tu mudanza</p><div id="cs-details" class="mt-8"></div></section>
          <section class="card"><p class="label-caps mb-16">Estado del servicio</p><div class="timeline" id="cs-timeline"></div></section>
          <div class="btn-stack">
            <a class="btn btn--primary btn--lg" href="seguimiento.html">Ver seguimiento en tiempo real <svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
            <a class="btn btn--outline" href="dashboard-cliente.html">Ir al inicio</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
