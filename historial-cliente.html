<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Historial – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="cliente" data-nav="historial" data-page="c-historial">
  <div class="app">
    <main class="main">
      <div class="container">

        <header class="page-head">
          <div><h1>Historial de servicios</h1><p class="page-head__sub" id="hist-count">4 servicios realizados</p></div>
          <a class="btn btn--primary" href="solicitar-mudanza.html">Nueva solicitud</a>
        </header>
        <div class="toolbar">
          <div class="tabs" id="hist-tabs" role="tablist" aria-label="Filtrar por estado">
            <button class="tab is-active" role="tab" aria-selected="true" data-filter="todos">Todos</button>
            <button class="tab" role="tab" aria-selected="false" data-filter="finalizado">Finalizado</button>
            <button class="tab" role="tab" aria-selected="false" data-filter="cancelado">Cancelado</button>
          </div>
        </div>
        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table table--stack">
              <thead><tr><th>ID</th><th>Ruta</th><th>Fecha</th><th>Proveedor</th><th>Estado</th><th>Costo</th><th>Calificación</th></tr></thead>
              <tbody id="hist-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true">
    <div class="modal__box">
      <div class="modal__head"><h3 id="detail-title">Detalle del servicio</h3><button class="modal__close" data-close aria-label="Cerrar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal__body" id="detail-body"></div>
      <div class="modal__foot"><button class="btn btn--outline" data-close>Cerrar</button><a class="btn btn--primary" id="detail-repeat" href="solicitar-mudanza.html">Repetir servicio</a></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
