<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vehículos – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="proveedor" data-nav="vehiculos" data-page="p-vehiculos">
  <div class="app">
    <main class="main">
      <div class="container container--mid">

        <header class="page-head">
          <div><h1>Gestión de vehículos</h1><p class="page-head__sub" id="veh-count">2 vehículos registrados</p></div>
          <button class="btn btn--primary" data-open="veh-modal"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar vehículo</button>
        </header>
        <div class="stack" id="veh-list"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="veh-modal" role="dialog" aria-modal="true" aria-labelledby="veh-title" aria-hidden="true">
    <form class="modal__box" id="veh-form" novalidate>
      <div class="modal__head"><h3 id="veh-title">Agregar vehículo</h3><button type="button" class="modal__close" data-close aria-label="Cerrar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal__body">
        <div class="field"><label for="vf-modelo">Marca y modelo</label><input class="input" id="vf-modelo" name="modelo" placeholder="Ej: Chevrolet NHR"><span class="field__error">Escribe la marca y el modelo.</span></div>
        <div class="form-grid mt-16">
          <div class="field"><label for="vf-placa">Placa</label><input class="input" id="vf-placa" name="placa" placeholder="ABC-123" autocomplete="off"><span class="field__error">Formato ABC-123.</span></div>
          <div class="field"><label for="vf-cap">Capacidad (toneladas)</label><input class="input" type="number" min="0.5" step="0.5" id="vf-cap" name="capacidad" placeholder="3"><span class="field__error">Indica la capacidad.</span></div>
        </div>
        <div class="field mt-16"><label for="vf-tipo">Tipo de vehículo</label>
          <select class="select" id="vf-tipo" name="tipo"><option>Van</option><option>Camión pequeño</option><option selected>Camión mediano</option><option>Camión grande</option></select></div>
      </div>
      <div class="modal__foot"><button type="button" class="btn btn--outline" data-close>Cancelar</button><button type="submit" class="btn btn--primary">Guardar vehículo</button></div>
    </form>
  </div>
  <script src="js/app.js"></script>
  <script src="js/proveedor.js"></script>
</body>
</html>
