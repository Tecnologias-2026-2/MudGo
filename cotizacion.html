<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cotización – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="cliente" data-nav="solicitar" data-page="c-cotizacion">
  <div class="app">
    <main class="main" data-back="solicitar-mudanza.html?editar=1" data-title="Cotización">
      <div class="container container--narrow">

        <header class="page-head">
          <div>
            <h1>Tu cotización estimada</h1>
            <p class="page-head__sub">El precio varía según distancia, carga, vehículo y personal.</p>
          </div>
        </header>

        <section class="card">
          <p class="label-caps mb-16">Detalles del servicio</p>
          <div id="q-route"></div>
          <div class="mini-stats" id="q-mini"></div>
        </section>

        <section class="card">
          <p class="label-caps">Desglose del precio</p>
          <div id="q-breakdown" class="mt-8"></div>
          <hr class="card__divider">
          <p class="small muted mb-16">Factores del costo</p>
          <div id="q-factors"></div>
        </section>

        <section class="total-card mt-16">
          <div>
            <div class="total-card__label">Total estimado</div>
            <div class="total-card__value" id="q-total">$198.450</div>
            <div class="total-card__note">Precio final puede variar ± 10%</div>
          </div>
          <div class="total-card__icon"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        </section>

        <div class="btn-stack">
          <a class="btn btn--primary btn--lg" id="q-confirm" href="confirmar-solicitud.html">Confirmar solicitud <svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
          <a class="btn btn--ghost" id="q-edit" href="solicitar-mudanza.html?editar=1">Modificar solicitud</a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
