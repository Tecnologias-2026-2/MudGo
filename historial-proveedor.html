<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Historial proveedor – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="proveedor" data-nav="historial" data-page="p-historial">
  <div class="app">
    <main class="main">
      <div class="container">

        <header class="page-head">
          <div><h1>Historial de servicios</h1><p class="page-head__sub">Tus servicios realizados</p></div>
        </header>
        <section class="stat-grid stat-grid--3">
          <div class="stat"><div class="stat__value" id="ph-earn">$520.000</div><div class="stat__label">Ganancias mes</div></div>
          <div class="stat"><div class="stat__value" id="ph-count">3</div><div class="stat__label">Servicios</div></div>
          <div class="stat"><div class="stat__value">4.8<span class="orange">★</span></div><div class="stat__label">Calificación</div></div>
        </section>
        <section class="card card--flush mt-24">
          <div class="table-wrap">
            <table class="table table--stack">
              <thead><tr><th>ID</th><th>Cliente</th><th>Ruta</th><th>Fecha</th><th>Estado</th><th>Ganancias</th></tr></thead>
              <tbody id="ph-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/proveedor.js"></script>
</body>
</html>
