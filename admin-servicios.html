<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestión de servicios – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="admin" data-nav="servicios" data-page="a-servicios">
  <div class="app">
    <main class="main">
      <div class="container container--wide">

        <header class="page-head">
          <div><h1>Gestión de servicios</h1><p class="page-head__sub" id="svc-count">6 servicios en total</p></div>
        </header>
        <div class="toolbar">
          <div class="search"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" type="search" id="svc-search" placeholder="Buscar por ID o cliente..." aria-label="Buscar servicio"></div>
          <div class="tabs" id="svc-tabs" role="tablist" aria-label="Filtrar por estado">
            <button class="tab is-active" role="tab" data-filter="todos">Todos</button>
            <button class="tab" role="tab" data-filter="en curso">En curso</button>
            <button class="tab" role="tab" data-filter="pendiente">Pendiente</button>
            <button class="tab" role="tab" data-filter="finalizado">Finalizado</button>
            <button class="tab" role="tab" data-filter="cancelado">Cancelado</button>
          </div>
        </div>
        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table table--stack">
              <thead><tr><th>ID</th><th>Cliente</th><th>Proveedor</th><th>Ruta</th><th>Fecha</th><th>Estado</th><th>Costo</th></tr></thead>
              <tbody id="svc-body-table"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="svc-modal" role="dialog" aria-modal="true" aria-labelledby="svc-title" aria-hidden="true">
    <div class="modal__box">
      <div class="modal__head"><h3 id="svc-title">Servicio</h3><button class="modal__close" data-close aria-label="Cerrar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal__body" id="svc-body"></div>
      <div class="modal__foot"><button class="btn btn--danger-soft hidden" id="svc-cancel">Cancelar servicio</button><button class="btn btn--outline" data-close>Cerrar</button></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
