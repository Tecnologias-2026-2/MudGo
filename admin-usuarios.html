<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gestión de usuarios – MudGo</title>
  <meta name="description" content="MudGo: plataforma de mudanzas y transporte de carga en Colombia.">
  <meta name="theme-color" content="#0069FF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-role="admin" data-nav="usuarios" data-page="a-usuarios">
  <div class="app">
    <main class="main">
      <div class="container container--wide">

        <header class="page-head">
          <div><h1>Gestión de usuarios</h1><p class="page-head__sub" id="users-count">6 usuarios registrados</p></div>
        </header>
        <div class="toolbar">
          <div class="search"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="input" type="search" id="users-search" placeholder="Buscar usuario..." aria-label="Buscar usuario"></div>
          <select class="select" id="users-filter" aria-label="Filtrar por estado" style="width:auto;height:38px">
            <option value="todos">Todos los estados</option><option value="activo">Activo</option><option value="inactivo">Inactivo</option><option value="suspendido">Suspendido</option>
          </select>
        </div>
        <section class="card card--flush">
          <div class="table-wrap">
            <table class="table table--stack">
              <thead><tr><th>Usuario</th><th>Correo</th><th>Teléfono</th><th>Tipo</th><th>Servicios</th><th>Estado</th><th>Acciones</th></tr></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="user-modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-t" aria-hidden="true">
    <div class="modal__box">
      <div class="modal__head"><h3 id="user-modal-t">Detalle del usuario</h3><button class="modal__close" data-close aria-label="Cerrar"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="modal__body" id="user-body"></div>
      <div class="modal__foot"><button class="btn btn--outline" data-close>Cerrar</button></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
